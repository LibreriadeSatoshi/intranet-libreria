# LDS federated identity — Story 00 (ENG-327)
# Applied automatically by the worker from /blueprints/custom (see docker-compose.yml).
# Everything decided in docs/design/00-identity-linking.md lives here as config:
# stock Authentik, no plugins.
version: 1
metadata:
  name: lds-identity
  labels:
    blueprints.goauthentik.io/description: >-
      LDS teachers/staff identity: GitHub + Google sources (email_link),
      internal user type on source enrollment, github_id claim, intranet OIDC client.
entries:
  # --- Social login sources (Flow 1: email_link auto-links on verified email) ---
  - model: authentik_sources_oauth.oauthsource
    id: source-github
    identifiers:
      slug: github
    attrs:
      name: GitHub
      provider_type: github
      consumer_key: !Env GITHUB_SOURCE_CLIENT_ID
      consumer_secret: !Env GITHUB_SOURCE_CLIENT_SECRET
      enabled: true
      user_matching_mode: email_link
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]

  - model: authentik_sources_oauth.oauthsource
    id: source-google
    identifiers:
      slug: google
    attrs:
      name: Google
      provider_type: google
      consumer_key: !Env GOOGLE_SOURCE_CLIENT_ID
      consumer_secret: !Env GOOGLE_SOURCE_CLIENT_SECRET
      enabled: true
      user_matching_mode: email_link
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]

  # --- Show both sources on the login screen ---
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      sources:
        - !KeyOf source-github
        - !KeyOf source-google

  # --- Spike gotcha fix: source-enrolled users must be internal (can open user UI) ---
  - model: authentik_stages_user_write.userwritestage
    identifiers:
      name: default-source-enrollment-write
    attrs:
      user_type: internal

  # --- Flow 3: github_id claim (numeric GitHub user ID from the linked source) ---
  - model: authentik_providers_oauth2.scopemapping
    id: mapping-github-id
    identifiers:
      name: lds-github-id-claim
    attrs:
      scope_name: github_id
      description: GitHub numeric user ID from the linked source connection
      expression: |
        from authentik.sources.oauth.models import UserOAuthSourceConnection
        conn = UserOAuthSourceConnection.objects.filter(
            user=request.user, source__slug="github").first()
        return {"github_id": int(conn.identifier)} if conn else {}

  # --- Intranet as OIDC client (consumed by ENG-328 / Auth.js) ---
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-intranet
    identifiers:
      name: lds-intranet-oidc
    attrs:
      client_type: confidential
      client_id: !Env INTRANET_OIDC_CLIENT_ID
      client_secret: !Env INTRANET_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # Spike gotcha: API/blueprint-created providers get empty grant_types unless explicit
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: !Env INTRANET_OIDC_REDIRECT_URI
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf mapping-github-id

  - model: authentik_core.application
    identifiers:
      slug: lds-intranet
    attrs:
      name: LDS Intranet
      provider: !KeyOf provider-intranet
